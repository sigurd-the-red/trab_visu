<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Estoque global de carros elétricos, 2013-2023</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h3>Estoque global de carros elétricos, 2013-2023</h3>
    <div class="main-container">
        <!-- Linha de status: mostra o andamento do carregamento e eventuais erros -->
        <p id="status">Iniciando...</p>
        <!-- Gráfico de colunas agrupadas. SVG grande (efeito de zoom); o wrapper adiciona a barra de rolagem lateral -->
        <h4 class="titulo-grafico">Colunas: estoque por tipo e ano</h4>
        <div class="scroll-container">
            <svg id="barSvg" width="2400" height="780">
            </svg>
        </div>
        <!-- Gráfico de linhas (abaixo do de colunas): evolução de cada tipo ao longo dos anos -->
        <h4 class="titulo-grafico">Linhas: evolução do estoque por tipo</h4>
        <div class="scroll-container">
            <svg id="lineSvg" width="2400" height="820">
            </svg>
        </div>
        <div class="buttom-container">
            <button id="loadBtn">Load Chart</button>
            <button id="clearBtn">Clear Chart</button>
        </div>
    </div>
    <p class="fonte">Fonte: IEA. Licença: CC BY 4.0. Unidade: milhões de veículos.</p>

    <script type="module" src="src/main.js"></script>
</body>

</html>
